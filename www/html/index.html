<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Welcome to My Nginx Site – a sample static website served by Nginx." />
    <title>Welcome to My Nginx Site</title>
    <style>
        /* ── Reset & Base ──────────────────────────────── */
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg: #0d1117;
            --surface: #161b22;
            --border: #30363d;
            --accent: #3fb950;
            --accent2: #58a6ff;
            --text: #c9d1d9;
            --muted: #8b949e;
            --radius: 12px;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        /* ── Card ──────────────────────────────────────── */
        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            max-width: 680px;
            width: 100%;
            padding: 3rem 2.5rem;
            box-shadow: 0 8px 32px rgba(0,0,0,0.5);
            animation: fadeUp .5s ease both;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(24px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        /* ── Badge ─────────────────────────────────────── */
        .badge {
            display: inline-flex;
            align-items: center;
            gap: .4rem;
            background: rgba(63,185,80,.12);
            color: var(--accent);
            border: 1px solid rgba(63,185,80,.3);
            border-radius: 999px;
            font-size: .75rem;
            font-weight: 600;
            letter-spacing: .06em;
            text-transform: uppercase;
            padding: .25rem .75rem;
            margin-bottom: 1.25rem;
        }
        .badge::before { content: '●'; font-size: .5rem; }

        /* ── Headings ──────────────────────────────────── */
        h1 {
            font-size: clamp(1.75rem, 4vw, 2.5rem);
            font-weight: 700;
            line-height: 1.2;
            margin-bottom: .75rem;
            background: linear-gradient(135deg, #c9d1d9 0%, var(--accent2) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        p.lead {
            color: var(--muted);
            font-size: 1.05rem;
            line-height: 1.65;
            margin-bottom: 2rem;
        }

        /* ── Info Grid ─────────────────────────────────── */
        .info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .info-item {
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 1rem 1.25rem;
        }

        .info-item .label {
            font-size: .7rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: .08em;
            color: var(--muted);
            margin-bottom: .35rem;
        }

        .info-item .value {
            font-size: .95rem;
            font-weight: 500;
            color: var(--accent2);
            font-family: 'Courier New', monospace;
        }

        /* ── CTA ───────────────────────────────────────── */
        .cta {
            display: inline-block;
            background: var(--accent);
            color: #0d1117;
            font-weight: 700;
            font-size: .9rem;
            padding: .65rem 1.5rem;
            border-radius: 8px;
            text-decoration: none;
            transition: opacity .2s, transform .2s;
        }
        .cta:hover { opacity: .85; transform: translateY(-2px); }

        /* ── Footer ────────────────────────────────────── */
        footer {
            margin-top: 3rem;
            font-size: .8rem;
            color: var(--muted);
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="badge">Live</div>
        <h1>Nginx is Running!</h1>
        <p class="lead">
            This is a dummy static site served by <strong>Nginx</strong>.
            Replace the contents of <code>/var/www/html/</code> with your
            own project files to get started.
        </p>

        <div class="info-grid">
            <div class="info-item">
                <div class="label">Server</div>
                <div class="value">Nginx</div>
            </div>
            <div class="info-item">
                <div class="label">Config Root</div>
                <div class="value">/etc/nginx/</div>
            </div>
            <div class="info-item">
                <div class="label">Document Root</div>
                <div class="value">/var/www/html/</div>
            </div>
            <div class="info-item">
                <div class="label">Port</div>
                <div class="value">80 / 443</div>
            </div>
        </div>

        <a class="cta" href="https://nginx.org/en/docs/" target="_blank" rel="noopener">
            Read the Docs →
        </a>
    </div>

    <footer>
        &copy; 2026 My Nginx Site &mdash; Powered by <strong>Nginx</strong>
    </footer>

</body>
</html>
